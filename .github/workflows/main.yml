name: Build Mario Kart PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with PSPDEV
        run: |
          docker pull pspdev/pspdev:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source" \
            -w /source \
            pspdev/pspdev:latest \
            sh -c "
              rm -rf build &&
              mkdir build &&
              cd build &&
              psp-cmake .. &&
              make -j2
            "

      - name: Check EBOOT.PBP
        run: |
          test -f build/EBOOT.PBP
          cp build/EBOOT.PBP EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v6
        with:
          name: MarioKartPSP-EBOOT-PBP
          path: EBOOT.PBP
